name: Node.js Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}

jobs:
  prepare:
    if: github.repository == 'reactant/usm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: pnpm
      - run: npm install --global npm@12.2.2 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset:status
      - run: pnpm release:check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm check:type
      - run: pnpm test
      - run: pnpm release:pack
      - name: Verify the exact release tarballs
        run: pnpm test:package --artifacts .release
      - run: pnpm release:dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    if: github.event_name == 'release' && github.repository == 'reactant/usm'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - run: npm install --global npm@12.2.2 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: .release
      - name: Publish verified packages with npm Trusted Publishing
        run: node scripts/release.mjs publish
